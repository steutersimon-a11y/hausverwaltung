name: ATLAS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Check browser-launch configuration
        run: |
          bash -n .devcontainer/post-create.sh .devcontainer/post-start.sh
          docker compose --env-file .env.example -f docker-compose.yml -f .devcontainer/docker-compose.yml config --quiet
      - run: node scripts/setup.mjs --env-only
      - run: docker compose up -d --wait
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm typecheck:hosted
      - run: pnpm test
      - run: pnpm test:hosted
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm build:hosted
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: always()
        run: docker compose down
