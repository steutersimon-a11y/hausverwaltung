name: atlas-property-os
services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas_local_only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["atlas_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 30
  objectstore:
    image: chrislusf/seaweedfs:4.38
    command: mini -dir=/data -ip.bind=0.0.0.0 -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-atlas_local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-atlas_s3_local_only}
      S3_BUCKET: ${S3_BUCKET:-atlas-private-documents}
    ports: ["127.0.0.1:9000:8333"]
    volumes: ["atlas_objects:/data"]
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 3s
      timeout: 5s
      retries: 30
volumes:
  atlas_postgres:
  atlas_objects:
